name: Validate and Generate BOM

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r utils/requirements.txt

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev cython

    - name: Validate metadata
      run: python utils/cli_validate_metadata.py

    - name: Generate BOM
      run: python utils/cli_make_bom.py
